services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: aipublish
      MYSQL_USER: aipublish
      MYSQL_PASSWORD: aipublish123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://aipublish:aipublish123@mysql:3306/aipublish?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ENABLED: "true"
      TASK_QUEUE_EMBEDDED_CONSUMER: "false"
      STORAGE_LOCAL_PATH: /data/materials
      COOKIE_DIR: /data/cookies
      SAU_VENDOR_PATH: /vendor/social-auto-upload
      WEB_DIST_PATH: /web/dist
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/chromium
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # 150 服务器正在使用的固定密钥：保证内置真实模型配置（ai_provider_config.json）可解密。
      # 注意：该密钥与提交到仓库的 ai_provider_config.json 真实 Key 绑定，请保持同步。
      COOKIE_ENCRYPTION_KEY: dev-cookie-key-change-in-prod

      # ============================================================
      # AI 厂商 API Key（私有仓库内置占位，部署前请替换为真实值，否则对应功能不可用）
      # 这些变量与前端“模型配置”中的厂商一一对应，填好后协作组拉代码即可直接使用。
      # ============================================================
      # 文案/通用大模型
      DEEPSEEK_API_KEY: "REPLACE_WITH_DEEPSEEK_API_KEY"
      DEEPSEEK_BASE_URL: "https://api.deepseek.com/v1"
      OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
      OPENAI_BASE_URL: "https://api.openai.com/v1"
      MOONSHOT_API_KEY: "REPLACE_WITH_MOONSHOT_API_KEY"
      MOONSHOT_BASE_URL: "https://api.moonshot.cn/v1"
      ZHIPU_API_KEY: "REPLACE_WITH_ZHIPU_API_KEY"
      ZHIPU_BASE_URL: "https://open.bigmodel.cn/api/paas/v4"
      BAIDU_API_KEY: "REPLACE_WITH_BAIDU_API_KEY"
      BAIDU_BASE_URL: "https://qianfan.baidubce.com/v2"
      SILICONFLOW_API_KEY: "REPLACE_WITH_SILICONFLOW_API_KEY"
      SILICONFLOW_BASE_URL: "https://api.siliconflow.cn/v1"
      MINIMAX_API_KEY: "REPLACE_WITH_MINIMAX_API_KEY"
      MINIMAX_BASE_URL: "https://api.minimax.io/v1"

      # 文生图 / 混元 / 腾讯系
      DOUBAO_API_KEY: "REPLACE_WITH_DOUBAO_API_KEY"
      DOUBAO_BASE_URL: "https://ark.cn-beijing.volces.com/api/v3"
      HUNYUAN_API_KEY: "REPLACE_WITH_HUNYUAN_API_KEY"
      HUNYUAN_BASE_URL: "https://api.hunyuan.cloud.tencent.com/v1"
      HUNYUAN_IMAGE_BASE_URL: "https://api.cloudai.tencent.com/v1"
      TENCENT_MAAS_API_KEY: "REPLACE_WITH_TENCENT_MAAS_API_KEY"
      TENCENT_MAAS_BASE_URL: "https://tokenhub.tencentmaas.com/v1"
      DASHSCOPE_API_KEY: "REPLACE_WITH_DASHSCOPE_API_KEY"

      # 图/视频生成（含数字人）：kling
      KLING_API_KEY: "REPLACE_WITH_KLING_API_KEY"
      KLING_BASE_URL: "https://api.klingai.com/v1"

      # 数字人 / 腾讯云视频（VOD）
      TENCENT_VOD_SECRET_ID: "REPLACE_WITH_TENCENT_VOD_SECRET_ID"
      TENCENT_VOD_SECRET_KEY: "REPLACE_WITH_TENCENT_VOD_SECRET_KEY"
      TENCENT_VOD_SUB_APP_ID: "REPLACE_WITH_TENCENT_VOD_SUB_APP_ID"
      TENCENT_VOD_MODEL: "Hailuo|H3"

      # Ollama（本地，无需 Key；如需可填本地模型名）
      OLLAMA_TEXT_MODEL: ""
    shm_size: "256mb"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ../vendor/social-auto-upload:/vendor/social-auto-upload
      - ./web/dist:/web/dist:ro
      - materials_data:/data/materials
      - cookies_data:/data/cookies
      - provider_config:/app/data
      - playwright_browsers:/opt/playwright
      - biliup_data:/root/.social-auto-upload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: ["python", "-m", "app.workers.redis_consumer"]
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://aipublish:aipublish123@mysql:3306/aipublish?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ENABLED: "true"
      TASK_QUEUE_EMBEDDED_CONSUMER: "false"
      STORAGE_LOCAL_PATH: /data/materials
      COOKIE_DIR: /data/cookies
      SAU_VENDOR_PATH: /vendor/social-auto-upload
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/chromium
    shm_size: "256mb"
    volumes:
      - ./backend:/app
      - ../vendor/social-auto-upload:/vendor/social-auto-upload
      - materials_data:/data/materials
      - cookies_data:/data/cookies
      - provider_config:/app/data
      - playwright_browsers:/opt/playwright
      - biliup_data:/root/.social-auto-upload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  mysql_data:
  materials_data:
  cookies_data:
  provider_config:
  playwright_browsers:
  biliup_data:
